<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Apex — Marketing Poster Kit</title>
  <link rel="stylesheet" href="kit.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="kit-header">
    <h1>Apex — Marketing Poster Kit</h1>
    <div class="meta">UI KIT · POSTER COMPOSITIONS · V.01</div>
  </div>

  <div id="root"></div>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="posters.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    const POSTERS = [
      { id: "logistics", label: "APEX LOGISTICS", Component: () => <PosterApexLogistics /> },
      { id: "labs",      label: "APEX LABS",      Component: () => <PosterApexLabs /> },
      { id: "orbital",   label: "APEX ORBITAL",   Component: () => <PosterApexOrbital /> },
    ];

    function App() {
      const [active, setActive] = useState("logistics");
      const current = POSTERS.find((p) => p.id === active);
      return (
        <div className="poster-list">
          <div className="switcher">
            {POSTERS.map((p) => (
              <button
                key={p.id}
                className={p.id === active ? "active" : ""}
                onClick={() => setActive(p.id)}
              >
                {p.label}
              </button>
            ))}
          </div>
          <current.Component />
          <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--fg-ghost)" }}>
            <span>POSTER {POSTERS.findIndex(p => p.id === active) + 1} / {POSTERS.length}</span>
            <span>RECREATED FROM REFERENCE · NO PRODUCT UI PROVIDED</span>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
