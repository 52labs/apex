<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { aspect-ratio: 1.4; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; border: 1px solid rgba(17,17,17,0.08); }
  .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.2; }
  .hex  { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; opacity: 0.7; }
  .on-ink { color: var(--paper-0); }
  .on-paper { color: var(--ink); }
</style></head>
<body>
  <div class="meta">PAPER · WARM LIGHT GRAYS · NEVER #FFF</div>
  <div class="grid">
    <div class="sw on-paper" style="background:#F2F0EB;"><div class="name">paper-0</div><div class="hex">#F2F0EB</div></div>
    <div class="sw on-paper" style="background:#E9E7E2;"><div class="name">paper</div><div class="hex">#E9E7E2</div></div>
    <div class="sw on-paper" style="background:#DEDCD6;"><div class="name">paper-1</div><div class="hex">#DEDCD6</div></div>
    <div class="sw on-paper" style="background:#C9C7C2;"><div class="name">paper-2</div><div class="hex">#C9C7C2</div></div>
  </div>
</body></html>
