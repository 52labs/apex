<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: 90px 1fr; gap: 16px 24px; row-gap: 6px; align-items: baseline; }
  .role { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--fg-2); text-transform: uppercase; }
  .ex { font-family: var(--font-mono); color: var(--ink); }
  .ex-xs { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .ex-sm { font-size: 13px; letter-spacing: 0.02em; }
  .ex-md { font-size: 15px; letter-spacing: 0; }
  .ex-lg { font-size: 22px; letter-spacing: 0; font-weight: 500; }
</style></head>
<body>
  <div class="meta">JETBRAINS MONO · METADATA · LOG · LABELS</div>
  <div class="row">
    <span class="role">XS LABEL</span><span class="ex ex-xs">ARCHIVE REF: T-LAB-23421-U8-FWD</span>
    <span class="role">SMALL</span><span class="ex ex-sm">Observation: Freight density spikes in western corridor.</span>
    <span class="role">BODY</span><span class="ex ex-md">REPORT ID: SUPPLY-CHAIN-482</span>
    <span class="role">LEAD</span><span class="ex ex-lg">[ SYSTEM INSIGHT LOG ]</span>
  </div>
</body></html>
