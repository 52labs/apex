<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  @page { size: A5 landscape; margin: 0.5cm; }
  html, body { background: var(--paper-0); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { padding: 16px 22px; }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; margin-bottom: 12px; }
  .log {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--paper-0);
    border: 1px solid var(--ink);
    padding: 12px 14px;
    color: var(--ink);
    line-height: 1.55;
    break-inside: avoid;
  }
  .log-title { font-weight: 500; letter-spacing: 0.06em; margin-bottom: 6px; }
  .log .k { color: var(--fg-2); }
  .log .v { color: var(--ink); }
  .pulse { color: var(--orange); }
</style></head>
<body>
  <div class="meta">SYSTEM LOG · PRODUCT-FLAVORED CALLOUT</div>
  <div class="log">
    <div class="log-title">[ SYSTEM INSIGHT LOG ]</div>
    <div><span class="k">Observation:</span> <span class="v">Freight density spikes in western corridor.</span></div>
    <div><span class="k">Inference:</span> <span class="v">Seasonal routing inefficiency detected.</span></div>
    <div><span class="k">Action:</span> <span class="v">Deploy alternate route AI to assist dispatch ops.</span></div>
    <div><span class="pulse">▪ Human validation required before network reroute.</span></div>
  </div>
  <script>
    (async () => {
      if (document.fonts && document.fonts.ready) { await document.fonts.ready; }
      setTimeout(() => window.print(), 500);
    })();
  </script>
</body></html>
