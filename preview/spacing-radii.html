<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 22px; }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cell { border: 1px solid var(--ink); padding: 12px; aspect-ratio: 1.4; display: flex; flex-direction: column; justify-content: space-between; background: var(--paper-0); }
  .demo { width: 56px; height: 36px; background: var(--ink); align-self: center; }
  .lbl  { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); }
  .hint { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); text-transform: uppercase; }
</style></head>
<body>
  <div class="meta">RADII · UI CHROME STAYS SQUARE</div>
  <div class="grid">
    <div class="cell"><div class="lbl">r-0 · 0px</div><div class="demo" style="border-radius:0"></div><div class="hint">UI CHROME</div></div>
    <div class="cell"><div class="lbl">r-1 · 2px</div><div class="demo" style="border-radius:2px"></div><div class="hint">FORM INPUTS</div></div>
    <div class="cell"><div class="lbl">r-2 · 4px</div><div class="demo" style="border-radius:4px"></div><div class="hint">PHYSICAL OBJECTS</div></div>
    <div class="cell"><div class="lbl">circle</div><div class="demo" style="border-radius:50%; width:36px;"></div><div class="hint">AVATARS ONLY</div></div>
  </div>
</body></html>
