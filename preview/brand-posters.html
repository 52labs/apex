<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 14px 22px; background: var(--paper); }
  .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; margin-bottom: 10px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .thumb { aspect-ratio: 16/9; background: var(--paper-1); overflow: hidden; border: 1px solid rgba(17,17,17,0.08); display: block; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-2); margin-top: 4px; }
</style></head>
<body>
  <div class="meta">POSTER REFERENCES · SOURCE OF VISUAL LANGUAGE</div>
  <div class="row">
    <div>
      <div class="thumb"><img src="../assets/posters/poster-apex-logistics.png" alt=""></div>
      <div class="cap">APEX LOGISTICS · AI OPERATIONS TERMINAL</div>
    </div>
    <div>
      <div class="thumb"><img src="../assets/posters/poster-text-labs.png" alt=""></div>
      <div class="cap">TEXT LABS · CENTER FOR AI EXPERIMENTS</div>
    </div>
    <div>
      <div class="thumb"><img src="../assets/posters/poster-orbital-systems.png" alt=""></div>
      <div class="cap">ORBITAL SYSTEMS · DOT-MATRIX VARIANT</div>
    </div>
  </div>
</body></html>
