<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 22px; }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .eyebrow { display: inline-block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px 3px; line-height: 1; }
  .ink { background: var(--ink); color: var(--paper-0); }
  .orange { background: var(--orange); color: var(--paper-0); }
  .ghost { color: var(--fg-2); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .square { display: inline-block; width: 10px; height: 10px; background: var(--orange); vertical-align: middle; margin-right: 6px; }
</style></head>
<body>
  <div class="meta">EYEBROW CHIPS · METADATA LABELS · MARKERS</div>
  <div class="row">
    <span class="eyebrow ink">EXPERIMENTAL SYSTEMS</span>
    <span class="eyebrow ink">AI ASSIST LAYER: ACTIVE</span>
    <span class="eyebrow orange">BUILT TO OPTIMIZE HUMAN POTENTIAL</span>
  </div>
  <div class="row" style="margin-top: 14px;">
    <span><span class="square"></span><span class="ghost">FUTURE OPERATIONS DEPT.</span></span>
    <span class="ghost">PROTOTYPE CLASS: GENERATIVE-01</span>
    <span class="ghost">//// AI-ENABLED INFRASTRUCTURE</span>
  </div>
</body></html>
