<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .cell {
    aspect-ratio: 1;
    background: var(--paper-0);
    border: 1px solid rgba(17,17,17,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 28px;
    color: var(--ink);
    position: relative;
  }
  .cell .lbl { position: absolute; bottom: 4px; left: 6px; font-size: 8px; letter-spacing: 0.06em; color: var(--fg-2); text-transform: uppercase; }
  .orange { color: var(--orange); }
  .ghost  { color: var(--ink-3); }
  .ascii  { font-size: 16px; }
  .sq { width: 14px; height: 14px; background: var(--orange); display: inline-block; }
  .bracket {
    width: 22px; height: 22px;
    border-top: 2px solid var(--orange);
    border-left: 2px solid var(--orange);
  }
</style></head>
<body>
  <div class="meta">BRAND GLYPHS · TYPOGRAPHIC ICONOGRAPHY</div>
  <div class="grid">
    <div class="cell orange ascii"><span>✱✱✱✱✱</span><span class="lbl">ASTERISK RUN</span></div>
    <div class="cell ascii"><span>+ + +</span><span class="lbl">PLUS</span></div>
    <div class="cell"><span class="ascii">////</span><span class="lbl">SLASH</span></div>
    <div class="cell orange ascii"><span>&gt;&gt;&gt;&gt;</span><span class="lbl">DIRECTIONAL</span></div>
    <div class="cell"><span class="sq"></span><span class="lbl">BLOCK</span></div>
    <div class="cell"><span class="bracket"></span><span class="lbl">BRACKET</span></div>
  </div>
</body></html>
