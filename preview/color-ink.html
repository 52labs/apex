<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { aspect-ratio: 1.4; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; border: 1px solid rgba(17,17,17,0.06); }
  .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.2; }
  .hex  { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; opacity: 0.7; }
  .on-ink { color: var(--paper-0); }
  .on-paper { color: var(--ink); }
</style></head>
<body>
  <div class="meta">INK · NEAR-BLACKS + GHOST · NEVER #000</div>
  <div class="grid">
    <div class="sw on-ink" style="background:#111111;"><div class="name">ink</div><div class="hex">#111111</div></div>
    <div class="sw on-ink" style="background:#2A2A2A;"><div class="name">ink-2</div><div class="hex">#2A2A2A</div></div>
    <div class="sw on-ink" style="background:#5C5C5A;"><div class="name">ink-3</div><div class="hex">#5C5C5A</div></div>
    <div class="sw on-paper" style="background:#ABA9A3;"><div class="name">ink-ghost</div><div class="hex">#ABA9A3</div></div>
  </div>
</body></html>
