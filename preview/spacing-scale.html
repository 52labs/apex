<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 22px; background: var(--paper); }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; margin-bottom: 14px; }
  .row { display: flex; align-items: flex-end; gap: 0; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .box { background: var(--ink); }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: var(--fg-2); text-transform: uppercase; }
  .num { font-family: var(--font-mono); font-size: 10px; color: var(--ink); }
</style></head>
<body>
  <div class="meta">SPACING SCALE · 4PX BASELINE</div>
  <div class="row" style="gap: 10px;">
    <div class="step"><div class="box" style="width:4px; height:36px;"></div><div class="num">4</div><div class="lbl">s-1</div></div>
    <div class="step"><div class="box" style="width:8px; height:36px;"></div><div class="num">8</div><div class="lbl">s-2</div></div>
    <div class="step"><div class="box" style="width:12px; height:36px;"></div><div class="num">12</div><div class="lbl">s-3</div></div>
    <div class="step"><div class="box" style="width:16px; height:36px;"></div><div class="num">16</div><div class="lbl">s-4</div></div>
    <div class="step"><div class="box" style="width:24px; height:36px;"></div><div class="num">24</div><div class="lbl">s-5</div></div>
    <div class="step"><div class="box" style="width:32px; height:36px;"></div><div class="num">32</div><div class="lbl">s-6</div></div>
    <div class="step"><div class="box" style="width:48px; height:36px;"></div><div class="num">48</div><div class="lbl">s-7</div></div>
    <div class="step"><div class="box" style="width:64px; height:36px;"></div><div class="num">64</div><div class="lbl">s-8</div></div>
    <div class="step"><div class="box" style="width:96px; height:36px;"></div><div class="num">96</div><div class="lbl">s-9</div></div>
  </div>
</body></html>
