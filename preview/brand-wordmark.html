<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 20px 28px; background: var(--paper); display: flex; align-items: center; }
  .meta { position: absolute; top: 12px; left: 28px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; }
  .wrap { position: relative; display: inline-flex; align-items: baseline; gap: 4px; }
  .wordmark {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 88px;
    letter-spacing: -0.04em;
    line-height: 0.9;
    text-transform: uppercase;
    color: var(--ink);
    position: relative;
    z-index: 1;
  }
  .reg { font-family: var(--font-mono); font-size: 18px; color: var(--ink-3); margin-left: 8px; align-self: flex-start; }
  .bar {
    position: absolute;
    left: -8px; right: -8px;
    top: 55%;
    height: 26px;
    transform: translateY(-50%) skewX(-22deg);
    background: var(--orange);
    z-index: 0;
    mix-blend-mode: multiply;
  }
  .tag {
    position: absolute;
    bottom: 14px; left: 28px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--fg-2);
    text-transform: uppercase;
  }
</style></head>
<body>
  <div class="meta">WORDMARK · APEX · WITH ACCENT BAR LOCK-UP</div>
  <div class="wrap">
    <div class="bar"></div>
    <div class="wordmark">APEX</div>
    <span class="reg">®</span>
  </div>
  <div class="tag">NEW YORK CITY · U.S.A · © 2026</div>
</body></html>
