<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sw { aspect-ratio: 1.6; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; }
  .role { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.2; }
  .hex  { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; opacity: 0.8; }
  .on-orange { color: var(--paper-0); }
</style></head>
<body>
  <div class="meta">ORANGE · VERMILION · THE ONLY ACCENT</div>
  <div class="grid">
    <div class="sw on-orange" style="background:#F38256;">
      <div class="role">TINT</div>
      <div><div class="name">orange-tint</div><div class="hex">#F38256</div></div>
    </div>
    <div class="sw on-orange" style="background:#EE5314;">
      <div class="role">DEFAULT · ACCENT</div>
      <div><div class="name">orange</div><div class="hex">#EE5314</div></div>
    </div>
    <div class="sw on-orange" style="background:#C8420C;">
      <div class="role">HOVER · PRESSED</div>
      <div><div class="name">orange-deep</div><div class="hex">#C8420C</div></div>
    </div>
  </div>
</body></html>
