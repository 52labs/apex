<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .stack { display: flex; flex-direction: column; gap: 4px; }
  .label { color: var(--fg-2); }
  .specimen { font-family: var(--font-display); color: var(--ink); line-height: 0.95; letter-spacing: -0.02em; }
  .s1 { font-size: 56px; font-weight: 800; }
  .s2 { font-size: 32px; font-weight: 700; }
  .s3 { font-size: 22px; font-weight: 600; }
  .s4 { font-size: 17px; font-weight: 500; }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-2); text-transform: uppercase; }
</style></head>
<body>
  <div class="stack">
    <div class="meta">ARCHIVO · DISPLAY · 500 / 600 / 700 / 800</div>
    <div class="specimen s1">Apex Logistics</div>
    <div class="specimen s2">Center for AI Experiments</div>
    <div class="specimen s3">Future Operations Department</div>
    <div class="specimen s4">Built to optimize human potential.</div>
  </div>
</body></html>
